[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-atendimento"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música — desafio Artefact"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langchain-core>=1,<2",
  "langchain-ollama>=1,<2",
  "langchain-openai>=1,<2",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
emporio = "emporio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

